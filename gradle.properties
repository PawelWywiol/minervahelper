# AGP 8.13 does not support JDK 25/26, and `java_home -v 17` resolves to JDK 25 on this machine.
# This path is local to the author's Mac — change it to your own JDK 17, or delete both lines if
# `java -version` already reports 17.
org.gradle.java.home=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home

org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
